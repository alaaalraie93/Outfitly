name: outfitly
description: "Outfitly - smart outfit matching from your own wardrobe."
publish_to: 'none'
version: 1.6.0+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  image: ^4.2.0
  # Ranges let the build pick the newest versions that fit the installed Flutter.
  google_mlkit_subject_segmentation: '>=0.0.3 <0.3.0'
  google_mlkit_image_labeling: '>=0.14.2 <0.17.0'
  share_plus: '>=10.0.0 <12.0.0'
  file_picker: 10.3.10

flutter:
  uses-material-design: true
